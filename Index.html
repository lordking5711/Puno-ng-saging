<body>

  <nav class="navbar">

    <li><a href="#videos">Video</a></li>
    <li><a href="#music">Music</a></li>
  </ul>
</nav>

  <div id="main-player" class="main-player hidden">
    <video id="player" controls></video>
  </div>

  <h2>Video Suggestions</h2>

    <div class="card" onclick="playVideo('/Yerro.mp4')">
      <div class="thumb"></div>
      <p>Yerro</p>
    </div>
    <div class="card" onclick="playVideo('/received_1516188916498607.mp4')">
      <div class="thumb"></div>
      <p>Maglipon</p>
    </div>
    <div class="card" onclick="playVideo('/Sardido.mp4')">
  <div class="thumb"></div>
  <p>Sardido</p>
</div>

  </div>

  <h2>Music Suggestions</h2>
  <div class="music-list">
    <div class="music-card">
      <p>Almadra</p>
      <audio controls>
        <source src="/love lesson no. 1 - 128.mp3" type="audio/mp3">
      </audio>
    </div>
    <div class="music-card">
      <p>Yerro</p>
      <audio controls>
        <source src="/On Melancholy Hill.mp3" type="audio/mp3">
      </audio>
    </div>
    <div class="music-card">
      <p>Maglipon</p>
      <audio controls>
        <source src="/Eliza Maturan - Museo (Official Music Video) - 128.mp3" type="audio/mp3">
      </audio>
    </div>
    <div class="music-card">
  <p>Sardido</p>
  <audio controls>
    <source src="/FORBIDDEN FRUIT - Tommee Profitt x Sam Tinnesz x brooke - 128.mp3" type="audio/mp3">
  </audio>
    
  </div>

  <script>
    function playVideo(file) {
      const mainPlayer = document.getElementById("main-player");
      const video = document.getElementById("player");
      video.src = file;
      mainPlayer.classList.remove("hidden");
      video.play();
    }
  </script>

</body>
</html>
